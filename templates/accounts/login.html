{% extends 'base.html' %}
{% load static %}

{% block title %}Login - Kiarash Cafe{% endblock %}

{% block content %}
<style>
    .login-section {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 120px 0 60px;
        background: linear-gradient(135deg, #FBF5C3 0%, #FEF1B4 100%);
    }

    .login-card {
        background: white;
        border-radius: 25px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        max-width: 420px;
        width: 100%;
    }

    .login-card h2 {
        color: #0A5C36;
        font-weight: 700;
        text-align: center;
        margin-bottom: 30px;
    }

    .login-card .form-control {
        border-radius: 12px;
        padding: 12px 16px;
        border: 2px solid #e0e0e0;
        transition: all 0.3s ease;
    }

    .login-card .form-control:focus {
        border-color: #225E2E;
        box-shadow: 0 0 0 3px rgba(34, 94, 46, 0.15);
    }

    .login-card .form-label {
        font-weight: 600;
        color: #0A5C36;
    }

    .login-card .btn-login {
        background: #225E2E;
        color: #FEF1B4;
        padding: 12px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 1.1rem;
        border: none;
        width: 100%;
        transition: all 0.3s ease;
    }

    .login-card .btn-login:hover {
        background: #0A5C36;
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(34, 94, 46, 0.3);
    }

    .login-card .register-link {
        text-align: center;
        margin-top: 20px;
    }

    .login-card .register-link a {
        color: #225E2E;
        font-weight: 600;
        text-decoration: none;
    }

    .login-card .register-link a:hover {
        text-decoration: underline;
    }

    .errorlist {
        color: #dc3545;
        font-size: 0.85rem;
        list-style: none;
        padding: 0;
        margin: 5px 0 0;
    }
</style>

<section class="login-section">
    <div class="login-card">
        <h2><i class="fas fa-sign-in-alt" style="color: #225E2E;"></i> Welcome Back</h2>

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Username or Email</label>
                <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
                {{ form.username.errors }}
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                {{ form.password.errors }}
            </div>

            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt me-2"></i> Login
            </button>
        </form>

        <div class="register-link">
            Don't have an account? <a href="{% url 'accounts:register' %}">Register here</a>
        </div>
    </div>
</section>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        gsap.from('.login-card', {
            y: 50,
            opacity: 0,
            duration: 0.8,
            ease: 'power2.out'
        });
    });
</script>
{% endblock %}
